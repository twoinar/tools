<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handy-Scan öffnen</title>
<style>
  body { margin:0; font:16px/1.5 system-ui, sans-serif; color:#1d1d1f; background:#fff; }
  @media (prefers-color-scheme: dark) { body { color:#e8eaed; background:#1f1f1f; } a { color:#8ab4f8; } }
  main { max-width:520px; margin:40px auto; padding:0 16px; }
</style>
</head>
<body>
<main>
  <h1>Handy-Scan</h1>
  <p id="text">Handy-Scan wird geöffnet …</p>
  <p>Klappt das nicht? Das Handy muss im <b>Büro-WLAN</b> sein und am Büro-PC muss Handy-Scan laufen.
     Direkt öffnen: <a id="link" href="#"></a></p>
</main>
<script>
  // Adresse des Büro-PCs, auf dem Handy-Scan läuft. Ändert sich die Adresse, nur hier anpassen –
  // der QR-Code auf der Apps-Seite bleibt gleich.
  const ZIEL = 'http://WOI-WKS-009:8765/';
  const a = document.getElementById('link');
  a.href = ZIEL; a.textContent = ZIEL;
  location.replace(ZIEL);
</script>
</body>
</html>
