# Tools des Notariats auf dem IONOS-Server. Wird von aktualisieren.sh nach /opt/tools/konfig/ kopiert
# und dort gestartet; Einrichtung siehe README.md in diesem Ordner.
name: tools

services:
  tools-web:
    image: caddy:2.10
    restart: unless-stopped
    env_file: .env
    # Kein veröffentlichter Port: erreichbar nur für den Caddy der Buchhaltung über das Netz „werkzeuge“.
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web:/srv/web:ro
    networks:
      - werkzeuge
      - intern

  # Benachrichtigung „Vorgespräch abgelegt“ (server/mail/benachrichtigen.py); nur für tools-web erreichbar
  tools-mail:
    image: python:3.12-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Berlin
    command: ["python", "-u", "/app/benachrichtigen.py"]
    volumes:
      - ./mail:/app:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    networks:
      - intern

networks:
  intern: {}
  werkzeuge:
    # Legt die Buchhaltung an (deploy/synology/mietserver.yml); hier nur mitbenutzt.
    name: werkzeuge
    external: true
