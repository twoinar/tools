<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  main { width: 100%; box-sizing: border-box; }
  .start { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; max-width: 420px; padding: 24px 16px; }
  .start button { font-size: 20px; padding: 22px 16px; justify-content: flex-start; gap: 14px; }
  .start button span { font-size: 30px; }
  .start p { text-align: center; margin: 0; }
  .chat { flex: 1; display: flex; flex-direction: column; min-height: 0; max-width: 820px; padding: 0 16px; }
  .kopf { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--rand); }
  .kopf b { flex: 1; font-size: 18px; }
  .kopf button { padding: 6px 12px; }
  #verlauf { flex: 1; overflow-y: auto; padding: 12px 0; }
  .msg { margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; overflow-wrap: anywhere; }
  .msg.ich { background: var(--flaeche); border: 1px solid var(--rand); margin-left: 15%; white-space: pre-wrap; }
  .msg.claude { padding-left: 0; padding-right: 0; }
  .msg.claude p, .msg.claude ul, .msg.claude ol { margin: 0 0 8px; }
  .msg.claude h3 { font-size: 16px; margin: 12px 0 6px; }
  .msg.claude table { border-collapse: collapse; margin: 6px 0 10px; font-size: 14px; }
  .msg.claude td, .msg.claude th { border: 1px solid var(--rand); padding: 4px 8px; text-align: left; vertical-align: top; }
  .msg.claude blockquote { margin: 0 0 8px; padding-left: 10px; border-left: 3px solid var(--rand); color: var(--leise); }
  .msg.claude pre { background: var(--flaeche); padding: 8px; border-radius: 6px; overflow-x: auto; }
  .msg .quellen { font-size: 13px; color: var(--leise); }
  .msg .quellen a { color: var(--leise); }
  .denkt { color: var(--leise); font-style: italic; }
  .eingabe { display: flex; gap: 8px; align-items: flex-end; padding: 8px 0; border-top: 1px solid var(--rand); }
  .eingabe textarea { flex: 1; font-size: 16px; max-height: 40vh; }
  .ablage { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 0 0 10px; }
  .ablage input { width: 9em; font-size: 16px; padding: 8px; }
  .ablage input#thema { width: 14em; }
  .ablage .hinweis { flex-basis: 100%; margin: 0; }
</style>
</head>
<body>
<main class="start" id="start">
  <button id="k-frage"><span>💬</span>Frage an Claude</button>
  <button id="k-karte"><span>🗺️</span>BrandenburgViewer</button>
  <button id="k-wert"><span>🏠</span>Grundstückswert</button>
  <p class="hilfe" id="start-hinweis">Keine Namen der Beteiligten eingeben. Für den Grundstückswert reichen Ort und Straße.</p>
</main>

<main class="chat" id="chat" hidden>
  <div class="kopf"><button id="zurueck" title="Zurück">←</button><b id="titel"></b><button id="neu">Neu</button></div>
  <div id="verlauf"></div>
  <div class="eingabe">
    <textarea id="text" rows="2" placeholder=""></textarea>
    <button id="senden" class="haupt">Senden</button>
  </div>
  <div class="ablage">
    <input id="nr" autocomplete="off" placeholder="Vorgangs-Nr.">
    <input id="thema" autocomplete="off" placeholder="Thema (z. B. Geschäftswert)">
    <button id="ablegen" disabled>Im Vorgang ablegen</button>
    <div id="meldung" class="hinweis" hidden></div>
  </div>
</main>

<script src="pdf-lib.min.js"></script>
<script src="aktenvermerk.js"></script>
<script src="claude.js"></script>
</body>
</html>
